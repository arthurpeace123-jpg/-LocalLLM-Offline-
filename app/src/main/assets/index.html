<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0f">
<title>Flowad</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,sans-serif;background:#0a0a0f;color:#eeeef5;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#hdr{background:#0f0f18;border-bottom:1px solid #1c1c2a;padding:10px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0}
#logo{font-weight:800;font-size:17px;color:#a78bfa;white-space:nowrap}
#msel{flex:1;background:#15151f;border:1px solid #1c1c2a;border-radius:20px;padding:6px 12px;color:#eeeef5;font-size:13px;-webkit-appearance:none;min-width:0}
#newbtn{background:#15151f;border:1px solid #1c1c2a;border-radius:8px;width:34px;height:34px;color:#8888aa;font-size:16px;cursor:pointer;flex-shrink:0}
#chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
#chat::-webkit-scrollbar{display:none}
#welcome{display:flex;flex-direction:column;align-items:center;padding:30px 20px;gap:14px;text-align:center}
#welcome h1{font-size:26px;font-weight:800}
#welcome p{color:#8888aa;font-size:14px;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:320px}
.chip{padding:7px 13px;background:#15151f;border:1px solid #1c1c2a;border-radius:16px;font-size:12.5px;color:#8888aa;cursor:pointer}
.chip:active{border-color:#6c63ff;color:#eeeef5}
.msg{display:flex;flex-direction:column;gap:3px}
.msg.u{align-items:flex-end}
.msg.a{align-items:flex-start}
.sndr{font-size:10px;color:#44445a;padding:0 3px}
.bbl{padding:10px 13px;border-radius:12px;font-size:14.5px;line-height:1.65;word-break:break-word;max-width:90%}
.u .bbl{background:rgba(108,99,255,.2);border:1px solid rgba(108,99,255,.25);border-top-right-radius:3px}
.a .bbl{background:#15151f;border:1px solid #1c1c2a;border-top-left-radius:3px;white-space:pre-wrap}
.dots{display:flex;gap:4px;padding:4px 0}
.dot{width:6px;height:6px;border-radius:50%;background:#a78bfa;animation:b 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes b{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
#bar{padding:8px 10px 14px;background:#0f0f18;border-top:1px solid #1c1c2a;flex-shrink:0}
#ibox{display:flex;align-items:flex-end;background:#15151f;border:1px solid #222235;border-radius:16px;overflow:hidden}
#ibox:focus-within{border-color:rgba(108,99,255,.5)}
#inp{flex:1;background:none;border:none;outline:none;color:#eeeef5;font-size:15px;padding:11px 12px;max-height:100px;resize:none;font-family:inherit;line-height:1.5}
#inp::placeholder{color:#44445a}
#sbtn{background:#6c63ff;border:none;border-radius:11px;margin:5px;width:38px;height:38px;color:white;font-size:18px;cursor:pointer;flex-shrink:0;font-weight:700}
#sbtn:disabled{background:#1c1c2a;color:#44445a}
.stcard{background:#15151f;border:1px solid #1c1c2a;border-radius:12px;padding:14px;width:100%;max-width:320px}
.stcard h3{font-size:13px;font-weight:600;color:#a78bfa;margin-bottom:10px}
.stfield{width:100%;background:#0a0a0f;border:1px solid #1c1c2a;border-radius:8px;padding:8px 10px;color:#eeeef5;font-size:13px;margin-bottom:8px}
.stfield:focus{outline:none;border-color:#6c63ff}
.stbtn{width:100%;background:#6c63ff;border:none;border-radius:8px;padding:10px;color:white;font-size:13px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div id="hdr">
  <span id="logo">🌊 Flowad</span>
  <select id="msel" onchange="selModel()"><option value="">Loading...</option></select>
  <button id="newbtn" onclick="newChat()">✦</button>
</div>
<div id="chat">
  <div id="welcome">
    <div style="font-size:52px">🌊</div>
    <h1>Flowad</h1>
    <p>Fully offline AI chat.<br>Powered by Ollama on your device.</p>
    <div class="stcard">
      <h3>⚡ Quick Setup</h3>
      <input class="stfield" id="qmodel" placeholder="Model name (e.g. paige-edu)">
      <input class="stfield" id="qurl" value="http://localhost:11434" placeholder="Ollama URL">
      <button class="stbtn" onclick="quickConnect()">Connect →</button>
    </div>
    <div class="chips">
      <div class="chip" onclick="use('Write a Python hello world program')">Python code</div>
      <div class="chip" onclick="use('Explain AI in simple terms')">Explain AI</div>
      <div class="chip" onclick="use('Write a motivational story')">Short story</div>
      <div class="chip" onclick="use('Give me 5 business ideas')">Business ideas</div>
    </div>
  </div>
</div>
<div id="bar">
  <div id="ibox">
    <textarea id="inp" placeholder="Message your AI..." rows="1"
      oninput="rsz(this)" onkeydown="onk(event)"></textarea>
    <button id="sbtn" onclick="send()" disabled>↑</button>
  </div>
</div>
<script>
var model='',ollamaUrl='http://localhost:11434',msgs=[],busy=false;

window.onload=function(){
  var sm=localStorage.getItem('fw_model');
  var su=localStorage.getItem('fw_url');
  if(su)ollamaUrl=su;
  loadModels(sm);
  document.getElementById('inp').addEventListener('input',function(){
    document.getElementById('sbtn').disabled=!this.value.trim()||busy||!model;
  });
};

function loadModels(preselect){
  fetch(ollamaUrl+'/api/tags',{signal:AbortSignal.timeout(5000)})
    .then(r=>r.json()).then(d=>{
      var models=(d.models||[]).map(m=>m.name);
      var sel=document.getElementById('msel');
      if(models.length===0){sel.innerHTML='<option>No models - run: ollama pull gemma3</option>';return;}
      sel.innerHTML='<option value="">Choose model...</option>'+models.map(m=>'<option value="'+m+'">'+m+'</option>').join('');
      var pick=preselect&&models.includes(preselect)?preselect:models[0];
      sel.value=pick;model=pick;
      localStorage.setItem('fw_model',pick);
    }).catch(()=>{
      document.getElementById('msel').innerHTML='<option value="">Ollama not found</option>';
    });
}

function selModel(){
  model=document.getElementById('msel').value;
  localStorage.setItem('fw_model',model);
  document.getElementById('sbtn').disabled=!model||busy||!document.getElementById('inp').value.trim();
}

function quickConnect(){
  var m=document.getElementById('qmodel').value.trim();
  var u=document.getElementById('qurl').value.trim()||'http://localhost:11434';
  ollamaUrl=u;
  localStorage.setItem('fw_url',u);
  if(m){model=m;localStorage.setItem('fw_model',m);}
  loadModels(m||null);
  document.getElementById('sbtn').disabled=false;
}

async function send(){
  var text=document.getElementById('inp').value.trim();
  if(!text||busy||!model)return;
  document.getElementById('welcome')&&(document.getElementById('welcome').style.display='none');
  document.getElementById('inp').value='';
  rsz(document.getElementById('inp'));
  document.getElementById('sbtn').disabled=true;
  busy=true;
  addMsg('u',text);
  msgs.push({role:'user',content:text});
  var tid='t'+Date.now();
  addMsg('a','',tid);
  try{
    var r=await fetch(ollamaUrl+'/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:model,messages:msgs.slice(-16),stream:true})
    });
    var reader=r.body.getReader();
    var dec=new TextDecoder();
    var full='';
    var el=document.getElementById(tid);
    while(true){
      var x=await reader.read();
      if(x.done)break;
      dec.decode(x.value).split('\n').forEach(line=>{
        if(!line.trim())return;
        try{
          var j=JSON.parse(line);
          if(j.message&&j.message.content){
            full+=j.message.content;
            if(el){el.querySelector('.bbl').textContent=full;document.getElementById('chat').scrollTop=99999;}
          }
        }catch(e){}
      });
    }
    msgs.push({role:'assistant',content:full});
  }catch(e){
    var el2=document.getElementById(tid);
    if(el2)el2.querySelector('.bbl').textContent='Error: '+e.message+'\n\nMake sure Ollama is running:\nollama serve';
  }
  busy=false;
  document.getElementById('sbtn').disabled=false;
  document.getElementById('chat').scrollTop=99999;
}

function addMsg(role,text,id){
  var d=document.createElement('div');
  d.className='msg '+(role==='u'?'u':'a');
  if(id)d.id=id;
  var c=text?text:'<div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  d.innerHTML='<div class="sndr">'+(role==='u'?'You':model)+'</div><div class="bbl">'+c+'</div>';
  document.getElementById('chat').appendChild(d);
  document.getElementById('chat').scrollTop=99999;
}

function newChat(){
  msgs=[];
  document.getElementById('chat').innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#44445a;font-size:14px">New chat started</div>';
}

function use(t){
  document.getElementById('inp').value=t;
  rsz(document.getElementById('inp'));
  document.getElementById('welcome')&&(document.getElementById('welcome').style.display='none');
  document.getElementById('sbtn').disabled=!model;
}

function rsz(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,100)+'px';}
function onk(e){if(e.key==='Enter'&&!e.shiftKey&&!('ontouchstart' in window)){e.preventDefault();send();}}
</script>
</body>
</html>
